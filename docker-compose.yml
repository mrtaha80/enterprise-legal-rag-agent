services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal_rag_net

  ollama:
    image: ollama/ollama:latest
    container_name: legal_rag_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - legal_rag_net

  legal-rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_rag_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=legal_contracts
      - OLLAMA_URL=http://ollama:11434/api/generate
      - LLM_MODEL=llama3.2
    depends_on:
      - qdrant
      - ollama
    networks:
      - legal_rag_net

networks:
  legal_rag_net:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
  ollama_models:
    driver: local