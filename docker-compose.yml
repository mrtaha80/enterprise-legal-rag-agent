version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: legal_rag_qdrant
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - legal_rag_net

  ollama:
    image: ollama/ollama:latest
    container_name: legal_rag_ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - /home/taha_tk/.ollama/models:/root/.ollama/models
    networks:
      - legal_rag_net

  legal-rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal_rag_app
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - "/mnt/c/Users/Taha tk/.cache/huggingface:/root/.cache/huggingface"
      - /app/venv
      - /app/__pycache__
      - /app/data
      - /app/evaluation
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - COLLECTION_NAME=legal_contracts
      - OLLAMA_URL=http://ollama:11434/api/generate
      - LLM_MODEL=llama3.2
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=poll
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    depends_on:
      - qdrant
      - ollama
    networks:
      - legal_rag_net

networks:
  legal_rag_net:
    driver: bridge

volumes:
  qdrant_data:
    driver: local
